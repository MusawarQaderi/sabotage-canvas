<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SABOTAGE CANVAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        font-family: 'Inter', system-ui, sans-serif;
      }
      body {
        background: #0b0f19;
      }
      .glass {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(30, 41, 59, 0.8);
        border-radius: 1rem;
      }
      .neon-cyan {
        box-shadow: 0 0 0.5rem rgba(34, 211, 238, 0.6), 0 0 1.2rem rgba(34, 211, 238, 0.4);
      }
      .neon-rose {
        box-shadow: 0 0 0.5rem rgba(244, 63, 94, 0.6), 0 0 1.2rem rgba(244, 63, 94, 0.4);
      }
      .neon-emerald {
        box-shadow: 0 0 0.5rem rgba(16, 185, 129, 0.6), 0 0 1.2rem rgba(16, 185, 129, 0.4);
      }
      #drawCanvas {
        touch-action: none;
      }
      .pulse {
        animation: pulseGlow 1s infinite;
      }
      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 0.4rem rgba(248, 113, 113, 0.5);
        }
        50% {
          box-shadow: 0 0 1rem rgba(248, 113, 113, 1);
        }
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen">
    <main class="max-w-7xl mx-auto p-4 md:p-6">
      <section id="lobbyPanel" class="glass p-6 max-w-2xl mx-auto mt-10 space-y-5">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-center">SABOTAGE CANVAS</h1>
        <p class="text-slate-300 text-center">Finde den Imposter, bevor er den Heist vollendet.</p>
        <div class="grid md:grid-cols-2 gap-4">
          <input id="nicknameInput" type="text" maxlength="18" placeholder="Nickname" class="bg-slate-950/70 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-cyan-400" />
          <input id="roomInput" type="text" maxlength="4" placeholder="Raumcode (optional)" class="bg-slate-950/70 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-cyan-400" />
        </div>
        <div class="grid md:grid-cols-2 gap-3">
          <button id="createBtn" class="rounded-xl py-3 font-semibold bg-cyan-500/20 border border-cyan-400/40 hover:bg-cyan-500/30 neon-cyan">Neuen Raum erstellen</button>
          <button id="joinBtn" class="rounded-xl py-3 font-semibold bg-emerald-500/20 border border-emerald-400/40 hover:bg-emerald-500/30 neon-emerald">Raum beitreten</button>
        </div>
        <p id="lobbyError" class="text-rose-400 min-h-6 text-sm text-center"></p>
      </section>

      <section id="gamePanel" class="hidden space-y-4">
        <div class="glass p-4 flex flex-wrap gap-3 items-center justify-between">
          <div>
            <p class="text-xs uppercase tracking-[0.18em] text-slate-400">Raum</p>
            <p class="text-xl font-bold"><span id="roomCodeLabel">----</span></p>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button id="inviteBtn" class="px-4 py-2 rounded-lg border border-cyan-400/40 bg-cyan-500/20 hover:bg-cyan-500/30">Invite Link</button>
            <button id="startBtn" class="px-4 py-2 rounded-lg border border-emerald-400/40 bg-emerald-500/20 hover:bg-emerald-500/30">Start Game</button>
            <button id="playAgainBtn" class="hidden px-4 py-2 rounded-lg border border-violet-400/40 bg-violet-500/20 hover:bg-violet-500/30">Play Again</button>
          </div>
        </div>

        <div class="grid lg:grid-cols-[1fr_320px] gap-4">
          <div class="space-y-3">
            <div id="rolePanel" class="glass p-4 flex flex-wrap items-center gap-2"></div>
            <div class="glass p-3">
              <div class="flex justify-between text-xs text-slate-300 mb-2"><span id="timerLabel">Bereit</span><span id="timerText">0.0s</span></div>
              <div id="timerWrap" class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                <div id="timerBar" class="h-full w-0 bg-emerald-400 transition-[width] duration-75"></div>
              </div>
            </div>
            <div class="glass p-3">
              <canvas id="drawCanvas" class="w-full h-[58vh] min-h-[340px] rounded-xl border border-slate-700 bg-slate-950/80"></canvas>
            </div>
            <div id="guessPanel" class="glass p-4 hidden">
              <p class="font-semibold mb-2">Finaler Guess: Gib das geheime Wort ein</p>
              <div class="flex gap-2">
                <input id="guessInput" type="text" class="flex-1 bg-slate-950/70 border border-slate-700 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-rose-400" />
                <button id="guessBtn" class="px-4 py-2 rounded-xl bg-rose-500/20 border border-rose-400/40 hover:bg-rose-500/30">Senden</button>
              </div>
            </div>
            <div id="statusPanel" class="glass p-4 text-sm text-slate-200"></div>
          </div>

          <aside class="glass p-4 space-y-3">
            <h2 class="text-lg font-bold">Spieler & Punkte</h2>
            <div id="playersList" class="space-y-2"></div>
          </aside>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
